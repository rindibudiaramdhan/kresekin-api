services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kresekin_api
      DB_USERNAME: kresekin
      DB_PASSWORD: secret
      DB_SCHEMA: public
      DB_SSLMODE: prefer
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_public_build:/var/www/html/public/build

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kresekin_api
      POSTGRES_USER: kresekin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kresekin -d kresekin_api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_vendor:
  app_public_build:
  postgres_data:
